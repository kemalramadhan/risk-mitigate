# Risk Mitigate — deployment lokal + Cloudflare Tunnel
# Jalankan: docker compose up -d --build
# URL publik ada di: docker compose logs cloudflared

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-risk_mitigate}"
      MYSQL_USER: "${DB_USERNAME:-risk_mitigate}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-risk_mitigate}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-rootsecret}"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    ports:
      - "8000:80"        # akses lokal di PC lab: http://localhost:8000

  # Cloudflare Quick Tunnel: memberi URL HTTPS publik otomatis.
  # URL muncul di log: docker compose logs cloudflared
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://app:80
    depends_on:
      - app

volumes:
  db_data:
